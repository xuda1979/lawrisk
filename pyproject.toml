[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawrisk"
version = "0.1.0"
description = "Law-firm contract risk scoring + clause diff tree (Harvey slice)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
lawrisk-serve = "lawrisk.serve:main"
lawrisk-cli = "lawrisk.cli:main"

[tool.setuptools]
packages = ["lawrisk", "lawrisk.diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
